<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; style-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'"
  />
  <title>HeliVMS</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <a class="skip" href="#content" data-i18n="a11y.skipToContent">略過至內容</a>
  <header id="app" class="topbar">
    <h1>HeliVMS</h1>
    <span id="health" class="badge">…</span>
    <span id="conn" class="badge on" role="status" aria-live="polite"></span>
    <span id="lic" class="badge" role="status" aria-live="polite"></span>
    <label><span data-i18n="app.apiKey">API 金鑰</span> <input id="apikey" type="password" placeholder="Enter API key" data-i18n-attr="placeholder:ph.apiKey" autocomplete="off" /></label>
    <form id="login">
      <input id="user" placeholder="Username" data-i18n-attr="placeholder:ph.username,aria-label:ph.username" autocomplete="username" aria-label="Username" autofocus />
      <input id="pass" type="password" placeholder="Password" data-i18n-attr="placeholder:ph.password,aria-label:ph.password" autocomplete="current-password" aria-label="Password" />
      <button type="submit" data-i18n="app.login">登入</button>
      <span id="login-msg" class="muted" aria-live="polite"></span>
    </form>
    <span id="who" class="badge">未登入</span>
    <button id="logout" type="button" hidden data-i18n="app.logout">登出</button>
    <span id="live" class="badge off">WS</span>
    <label class="locale-pick">
      <span data-i18n="app.language">語言</span>
      <select id="locale" aria-label="Language" data-i18n-attr="aria-label:app.language">
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
      </select>
    </label>
  </header>

  <nav class="tabs" role="tablist" aria-label="Sections" data-i18n-attr="aria-label:a11y.tablist">
    <button type="button" id="tabbtn-live" class="tab active" role="tab" data-tab="live" aria-selected="true" aria-controls="panel-live"><span data-i18n="nav.liveWatch">即時監看</span></button>
    <button type="button" id="tabbtn-playback" class="tab" role="tab" data-tab="playback" aria-selected="false" aria-controls="panel-playback"><span data-i18n="nav.remotePlayback">遠程回放</span></button>
    <button type="button" id="tabbtn-snapshot" class="tab" role="tab" data-tab="snapshot" aria-selected="false" aria-controls="panel-snapshot"><span data-i18n="nav.snapshot">截圖</span></button>
    <button type="button" id="tabbtn-ptz" class="tab" role="tab" data-tab="ptz" aria-selected="false" aria-controls="panel-ptz"><span data-i18n="nav.ptz">PTZ 控制</span></button>
    <button type="button" id="tabbtn-events" class="tab" role="tab" data-tab="events" aria-selected="false" aria-controls="panel-events"><span data-i18n="nav.events">事件搜尋</span></button>
    <button type="button" id="tabbtn-io" class="tab" role="tab" data-tab="io" aria-selected="false" aria-controls="panel-io"><span data-i18n="nav.io">IO 接點</span></button>
    <button type="button" id="tabbtn-settings" class="tab" role="tab" data-tab="settings" aria-selected="false" aria-controls="panel-settings"><span data-i18n="nav.settings">設定</span></button>
  </nav>

  <main class="grid" id="content">
    <section class="panel wide" id="panel-live" data-panel="live" role="tabpanel" aria-labelledby="tabbtn-live">
      <h2><span data-i18n="nav.liveWatch">即時監看</span> <span class="muted" data-i18n="live.webrtcHint">WebRTC／低延遲</span></h2>
      <form id="live-form" class="row-form">
        <label><span data-i18n="live.layout">版面</span>
          <select id="live-layout" aria-label="Layout" data-i18n-attr="aria-label:live.layout">
            <option value="1">1</option>
            <option value="4">2×2</option>
            <option value="9">3×3</option>
            <option value="16">4×4</option>
            <option value="25">5×5</option>
          </select>
        </label>
        <select id="live-channels" multiple size="3" aria-label="Channels" data-i18n-attr="aria-label:live.channels"></select>
        <button type="submit" data-i18n="action.openLive">開啟即時畫面</button>
        <button type="button" id="live-stop" data-i18n="action.stopLive">停止</button>
        <span id="live-msg" class="muted" aria-live="polite"></span>
      </form>
      <div id="live-grid" class="live-grid"></div>
      <div id="live-meta" class="muted"></div>
    </section>

    <section class="panel wide" id="panel-playback" data-panel="playback" role="tabpanel" aria-labelledby="tabbtn-playback" hidden>
      <h2><span data-i18n="nav.remotePlayback">遠程回放</span> <span class="muted" data-i18n="play.hlsHint">HLS／已錄影</span></h2>
      <form id="play-form" class="row-form">
        <select id="play-node" aria-label="Source node" data-i18n-attr="aria-label:replay.node"></select>
        <input id="play-channel" type="number" min="1" step="1" list="play-channel-options" aria-label="Channel number" data-i18n-attr="aria-label:ph.channelNumber" required />
        <datalist id="play-channel-options"></datalist>
        <input id="play-from" type="datetime-local" aria-label="Start time" data-i18n-attr="aria-label:ph.startTime" required />
        <input id="play-to" type="datetime-local" aria-label="End time" data-i18n-attr="aria-label:ph.endTime" required />
        <button type="submit" data-i18n="action.load">載入回放</button>
        <span id="play-msg" class="muted" aria-live="polite"></span>
      </form>
      <video id="play-video" class="player" controls playsinline preload="metadata"></video>
      <div id="play-clock" class="play-clock"></div>
      <div id="play-meta" class="muted"></div>
    </section>

    <section class="panel wide" id="panel-snapshot" data-panel="snapshot" role="tabpanel" aria-labelledby="tabbtn-snapshot" hidden>
      <h2><span data-i18n="nav.snapshot">截圖</span> <span class="muted" data-i18n="snapshot.hint">由即時畫面擷取 PNG</span></h2>
      <form id="snap-form" class="row-form">
        <input id="snap-channel" type="number" min="1" step="1" list="snap-channel-options" aria-label="Channel number" data-i18n-attr="aria-label:ph.channelNumber" required />
        <datalist id="snap-channel-options"></datalist>
        <button type="submit" data-i18n="action.openLive">開啟即時畫面</button>
        <button type="button" id="snap-stop" data-i18n="action.stopLive">停止</button>
        <button type="button" id="snap-capture" data-i18n="action.capture">擷取畫面</button>
        <span id="snap-msg" class="muted" aria-live="polite"></span>
      </form>
      <video id="snap-video" class="player" autoplay muted playsinline></video>
      <div id="snap-meta" class="muted"></div>
    </section>

    <section class="panel wide" id="panel-ptz" data-panel="ptz" role="tabpanel" aria-labelledby="tabbtn-ptz" hidden>
      <h2><span data-i18n="nav.ptz">PTZ 控制</span></h2>
      <form id="ptz-form" class="row-form">
        <input id="ptz-channel" type="number" min="1" step="1" list="ptz-channel-options" aria-label="Channel number" data-i18n-attr="aria-label:ph.channelNumber" required />
        <datalist id="ptz-channel-options"></datalist>
        <button type="submit" data-i18n="action.ptzConnect">連線</button>
        <label><span data-i18n="ptz.profile">碼流</span>
          <select id="ptz-profile" aria-label="Profile" data-i18n-attr="aria-label:ptz.profile"></select>
        </label>
        <span id="ptz-msg" class="muted" aria-live="polite"></span>
      </form>
      <div id="ptz-pad" class="ptz-pad">
        <button type="button" class="ptz-btn" data-move="-1,1,0" aria-label="Up-left" data-i18n-attr="aria-label:ptz.upLeft">↖</button>
        <button type="button" class="ptz-btn" data-move="0,1,0" aria-label="Up" data-i18n-attr="aria-label:ptz.up">↑</button>
        <button type="button" class="ptz-btn" data-move="1,1,0" aria-label="Up-right" data-i18n-attr="aria-label:ptz.upRight">↗</button>
        <button type="button" class="ptz-btn" data-move="-1,0,0" aria-label="Left" data-i18n-attr="aria-label:ptz.left">←</button>
        <button type="button" class="ptz-btn ptz-stop" id="ptz-stop" aria-label="Stop" data-i18n-attr="aria-label:ptz.stop">■</button>
        <button type="button" class="ptz-btn" data-move="1,0,0" aria-label="Right" data-i18n-attr="aria-label:ptz.right">→</button>
        <button type="button" class="ptz-btn" data-move="-1,-1,0" aria-label="Down-left" data-i18n-attr="aria-label:ptz.downLeft">↙</button>
        <button type="button" class="ptz-btn" data-move="0,-1,0" aria-label="Down" data-i18n-attr="aria-label:ptz.down">↓</button>
        <button type="button" class="ptz-btn" data-move="1,-1,0" aria-label="Down-right" data-i18n-attr="aria-label:ptz.downRight">↘</button>
      </div>
      <div class="row-form">
        <button type="button" data-move="0,0,1" aria-label="Zoom in" data-i18n-attr="aria-label:ptz.zoomIn">+</button>
        <button type="button" data-move="0,0,-1" aria-label="Zoom out" data-i18n-attr="aria-label:ptz.zoomOut">−</button>
        <button type="button" id="ptz-home" data-i18n="ptz.home">回預設位</button>
      </div>
      <form id="ptz-preset-form" class="row-form">
        <select id="ptz-preset-list" aria-label="Preset" data-i18n-attr="aria-label:ptz.preset"></select>
        <input id="ptz-preset-name" placeholder="Preset name" data-i18n-attr="placeholder:ptz.presetName,aria-label:ptz.presetName" aria-label="Preset name" />
        <button type="button" id="ptz-preset-save" data-i18n="ptz.savePreset">儲存預設點</button>
        <button type="button" id="ptz-preset-goto" data-i18n="ptz.gotoPreset">前往預設點</button>
        <button type="button" id="ptz-preset-delete" data-i18n="ptz.deletePreset">刪除預設點</button>
      </form>
    </section>

    <section class="panel wide" id="panel-events" data-panel="events" role="tabpanel" aria-labelledby="tabbtn-events" hidden>
      <h2 data-i18n="nav.events">事件搜尋</h2>
      <form id="search-form" class="row-form">
        <input id="q" placeholder="Keyword" data-i18n-attr="placeholder:ph.keyword,aria-label:ph.searchKeyword" aria-label="Event search keyword" />
        <button type="submit" data-i18n="action.search">搜尋</button>
        <span id="events-msg" class="muted" aria-live="polite"></span>
      </form>
      <table id="events">
        <thead><tr><th scope="col">ID</th><th scope="col" data-i18n="col.time">時間</th><th scope="col" data-i18n="col.source">來源</th><th scope="col" data-i18n="col.text">內容</th><th scope="col" data-i18n="col.status">狀態</th></tr></thead>
        <tbody></tbody>
      </table>
      <h2><span data-i18n="panel.liveAlarms">即時警報流</span></h2>
      <ul id="live-log" class="log" role="log" aria-live="polite"></ul>
    </section>

    <section class="panel wide" id="panel-io" data-panel="io" role="tabpanel" aria-labelledby="tabbtn-io" hidden>
      <h2><span data-i18n="nav.io">IO 接點</span> <span class="muted" data-i18n="io.hint">攝影機 DI/DO 乾接點</span></h2>
      <form id="io-form" class="row-form">
        <input id="io-channel" type="number" min="1" step="1" list="io-channel-options" aria-label="Channel number" data-i18n-attr="aria-label:ph.channelNumber" required />
        <datalist id="io-channel-options"></datalist>
        <button type="submit" data-i18n="action.ioLoad">讀取</button>
        <span id="io-msg" class="muted" aria-live="polite"></span>
      </form>
      <h3 data-i18n="io.inputs">數位輸入 (DI)</h3>
      <table id="io-inputs">
        <thead><tr><th scope="col" data-i18n="col.token">權杖</th><th scope="col" data-i18n="col.name">名稱</th><th scope="col" data-i18n="col.label">標籤</th></tr></thead>
        <tbody></tbody>
      </table>
      <h3 data-i18n="io.outputs">繼電器輸出 (DO)</h3>
      <table id="io-outputs">
        <thead><tr><th scope="col" data-i18n="col.token">權杖</th><th scope="col" data-i18n="col.name">名稱</th><th scope="col" data-i18n="col.label">標籤</th><th scope="col" data-i18n="col.action">動作</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel wide" id="panel-settings" data-panel="settings" role="tabpanel" aria-labelledby="tabbtn-settings" hidden>
      <h2 data-i18n="nav.settings">設定</h2>
      <form id="settings-form" class="row-form">
        <label><input id="set-auth-enabled" type="checkbox" /> <span data-i18n="setting.enableAuth">啟用帳號登入</span></label>
        <label><span data-i18n="setting.lockThreshold">鎖定次數</span> <input id="set-lock-threshold" type="number" min="1" max="99" step="1" aria-label="Lockout attempts" data-i18n-attr="aria-label:setting.lockThreshold" /></label>
        <label><span data-i18n="setting.lockMinutes">鎖定分鐘</span> <input id="set-lock-minutes" type="number" min="1" max="1440" step="1" aria-label="Lockout minutes" data-i18n-attr="aria-label:setting.lockMinutes" /></label>
        <label><span data-i18n="setting.retentionDays">保留天數</span> <input id="set-retention-days" type="number" min="1" max="3650" step="1" aria-label="Retention days" data-i18n-attr="aria-label:setting.retentionDays" /></label>
        <label><span data-i18n="setting.watermarkGb">浮水印GB</span> <input id="set-watermark-gb" type="number" min="0" max="99999" step="0.1" aria-label="Watermark GB" data-i18n-attr="aria-label:setting.watermarkGb" /></label>
        <label><span data-i18n="setting.alarmRetention">警報保留</span> <input id="set-alarm-retention" type="number" min="1" max="36500" step="1" aria-label="Alarm retention" data-i18n-attr="aria-label:setting.alarmRetention" /></label>
        <label><span data-i18n="setting.auditRetention">稽核保留</span> <input id="set-audit-retention" type="number" min="0" max="36500" step="1" aria-label="Audit retention" data-i18n-attr="aria-label:setting.auditRetention" /></label>
        <button type="submit" data-i18n="setting.save">儲存設定</button>
        <span id="settings-msg" class="muted" aria-live="polite"></span>
      </form>
      <div id="settings-usage" class="muted" role="status" aria-live="polite"></div>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
