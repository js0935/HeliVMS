<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HeliVMS</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header id="app" class="topbar">
    <h1>HeliVMS</h1>
    <span id="health" class="badge">…</span>
    <span id="kpi" class="badge">…</span>
    <span id="sw" class="badge">…</span>
    <span id="pos" class="badge muted">…</span>
    <label>API 金鑰 <input id="apikey" type="password" placeholder="helivms-dev-key" /></label>
    <form id="login">
      <input id="user" placeholder="帳號" autocomplete="username" />
      <input id="pass" type="password" placeholder="密碼" autocomplete="current-password" />
      <button type="submit">登入</button>
      <span id="login-msg" class="muted"></span>
    </form>
    <span id="who" class="badge">未登入</span>
    <button id="logout" type="button" hidden>登出</button>
    <span id="live" class="badge off">WS</span>
  </header>

  <main class="grid">
    <section class="panel">
      <h2>頻道</h2>
      <ul id="channels"></ul>
    </section>

    <section class="panel">
      <h2>警報看板 <span id="board-summary" class="muted"></span></h2>
      <table id="board">
        <thead><tr><th>#</th><th>頻道</th><th>類型</th><th>優先</th><th>動作</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel">
      <h2>事件搜尋</h2>
      <form id="search-form">
        <input id="q" placeholder="關鍵字" />
        <button>搜尋</button>
      </form>
      <table id="events">
        <thead><tr><th>ID</th><th>時間</th><th>頻道</th><th>類型</th><th>狀態</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel wide" id="accounts-panel" hidden>
      <h2>帳號管理</h2>
      <form id="account-form" class="row-form">
        <input id="new-user" placeholder="帳號" required />
        <input id="new-pass" type="password" placeholder="密碼" required />
        <select id="new-role">
          <option value="viewer">viewer</option>
          <option value="admin">admin</option>
        </select>
        <button type="submit">新增</button>
        <span id="account-msg" class="muted"></span>
      </form>
      <table id="accounts">
        <thead><tr><th>帳號</th><th>角色</th><th>狀態</th><th>操作</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel wide">
      <h2>回放時間軸 <span id="gap" class="muted"></span></h2>
      <div class="timeline-tools">
        <button id="timeline-down" type="button">‹ 前一天</button>
        <input id="timeline-day" type="date" />
        <button id="timeline-up" type="button">後一天 ›</button>
      </div>
      <div id="timeline" class="timeline"></div>
    </section>

    <section class="panel wide">
      <h2>地圖視界</h2>
      <div id="map" class="map"></div>
    </section>

    <section class="panel wide" id="config-panel" hidden>
      <h2>登入設定</h2>
      <form id="config-form" class="row-form">
        <label><input id="auth-enabled" type="checkbox" /> 啟用帳號登入</label>
        <label>鎖定次數 <input id="lock-threshold" type="number" min="1" max="99" /></label>
        <label>鎖定分鐘 <input id="lock-minutes" type="number" min="1" max="1440" /></label>
        <button type="submit">儲存</button>
        <span id="config-msg" class="muted"></span>
      </form>
    </section>

    <section class="panel wide">
      <h2>智慧看板視界 <span id="sw" class="badge">…</span></h2>
      <div id="swgrid" class="swgrid"></div>
    </section>

    <section class="panel wide" id="audit-panel" hidden>
      <h2>稽核日誌</h2>
      <div class="row-form">
        <select id="audit-category">
          <option value="">全部類別</option>
          <option>auth</option>
          <option>config</option>
          <option>export</option>
          <option>evidence</option>
          <option>share</option>
          <option>retention</option>
          <option>legal_hold</option>
        </select>
        <input id="audit-actor" placeholder="操作者" />
        <a id="audit-csv" href="/api/audit/export.csv" download>下載 CSV</a>
      </div>
      <table id="audit">
        <thead><tr><th>時間</th><th>類別</th><th>操作者</th><th>動作</th><th>目標</th><th>細節</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel wide">
      <h2>日報 <span id="daily-summary" class="muted"></span></h2>
      <table id="daily-events" class="compact">
        <thead><tr><th>事件類別</th><th>次數</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>

    <section class="panel wide">
      <h2>即時警報流</h2>
      <ul id="live-log" class="log"></ul>
    </section>
  </main>

  <script type="module" src="./app.js"></script>
</body>
</html>
