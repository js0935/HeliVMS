<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data:; media-src 'self' blob:; style-src 'self'; base-uri 'none'; object-src 'none'; form-action 'self'"
  />
  <title>HeliVMS</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!--
    主介面。登入是不可跳過的前置頁（login.html）：未通過憑證時 app.js 直接導向那頁，
    這裡一開始保持 hidden，避免等待 /api/config 時先閃一下監看首頁。
  -->
  <div id="app-shell" hidden>
  <a class="skip" href="#content" data-i18n="a11y.skipToContent">略過至內容</a>
  <header id="app" class="topbar">
    <h1>HeliVMS</h1>
    <span id="health" class="badge">…</span>
    <span id="conn" class="badge on" role="status" aria-live="polite"></span>
    <span id="lic" class="badge" role="status" aria-live="polite"></span>
    <span id="who" class="badge">未登入</span>
    <button id="logout" type="button" hidden data-i18n="app.logout">登出</button>
    <span id="live" class="badge off">WS</span>
    <label class="locale-pick">
      <span data-i18n="app.language">語言</span>
      <select id="locale" aria-label="Language" data-i18n-attr="aria-label:app.language">
        <option value="zh-TW">繁體中文</option>
        <option value="en">English</option>
      </select>
    </label>
  </header>

  <!--
    四個主頁籤，其餘功能收進各自主頁的次分頁（參考機 QCV8001 的結構：
    監看／回放／事件／設定，截圖與 PTZ 是監看的工具列而不是獨立頁）。
    「九個平鋪頁籤」是操作員回報「功能雜亂」的直接原因：每一項都要先想「它在哪一頁」。
  -->
  <nav class="tabs" role="tablist" aria-label="Sections" data-i18n-attr="aria-label:a11y.tablist">
    <button type="button" id="tabbtn-live" class="tab active" role="tab" data-tab="live" aria-selected="true" aria-controls="panel-live"><span data-i18n="nav.liveWatch">即時監看</span></button>
    <button type="button" id="tabbtn-playback" class="tab" role="tab" data-tab="playback" aria-selected="false" aria-controls="panel-playback"><span data-i18n="nav.remotePlayback">遠程回放</span></button>
    <button type="button" id="tabbtn-events" class="tab" role="tab" data-tab="events" aria-selected="false" aria-controls="panel-events"><span data-i18n="nav.events">事件搜尋</span></button>
    <button type="button" id="tabbtn-settings" class="tab" role="tab" data-tab="settings" aria-selected="false" aria-controls="panel-settings"><span data-i18n="nav.settings">設定</span></button>
  </nav>

  <main class="grid" id="content">
    <section class="panel wide" id="panel-live" data-panel="live" role="tabpanel" aria-labelledby="tabbtn-live">
      <h2><span data-i18n="nav.liveWatch">即時監看</span> <span class="muted" data-i18n="live.webrtcHint">WebRTC／低延遲</span></h2>

      <nav class="subtabs" role="tablist" data-subtab-group="live" aria-label="Live tools" data-i18n-attr="aria-label:a11y.liveTools">
        <button type="button" id="subtabbtn-live" class="subtab active" role="tab" data-subtab="wall" aria-selected="true" aria-controls="subpanel-live"><span data-i18n="sub.wall">監看牆</span></button>
        <button type="button" id="subtabbtn-snapshot" class="subtab" role="tab" data-subtab="snapshot" aria-selected="false" aria-controls="subpanel-snapshot"><span data-i18n="nav.snapshot">截圖</span></button>
        <button type="button" id="subtabbtn-ptz" class="subtab" role="tab" data-subtab="ptz" aria-selected="false" aria-controls="subpanel-ptz"><span data-i18n="nav.ptz">PTZ 控制</span></button>
      </nav>

      <div class="subpanels" data-subpanel-group="live">
        <div id="subpanel-live" class="subpanel" data-subpanel="wall" role="tabpanel" aria-labelledby="subtabbtn-live">
          <!--
            不再提供頻道多選清單：按幾分割就依序顯示幾路攝影機，再按一次同一版面
            換下一批。版面必須用按鈕而不是下拉選單——選相同的值不會觸發 change，
            「再按一次四分割」就沒有辦法被偵測到。
          -->
          <form id="live-form" class="row-form">
            <span data-i18n="live.layout">版面</span>
            <div id="live-layout" class="layout-picker" role="group" data-i18n-attr="aria-label:live.layout,title:live.layoutHint">
              <button type="button" data-layout="1" aria-pressed="true">1</button>
              <button type="button" data-layout="4" aria-pressed="false">2×2</button>
              <button type="button" data-layout="9" aria-pressed="false">3×3</button>
              <button type="button" data-layout="16" aria-pressed="false">4×4</button>
              <button type="button" data-layout="25" aria-pressed="false">5×5</button>
            </div>
            <button type="button" id="live-stop" class="btn-quiet" data-i18n="action.stopLive">停止</button>
            <span id="live-msg" class="muted" aria-live="polite"></span>
          </form>
          <div id="live-grid" class="live-grid"></div>
          <div id="live-meta" class="muted"></div>
        </div>

        <div id="subpanel-snapshot" class="subpanel" data-subpanel="snapshot" role="tabpanel" aria-labelledby="subtabbtn-snapshot" hidden>
          <form id="snap-form" class="row-form">
            <input id="snap-channel" type="number" min="1" step="1" list="snap-channel-options" aria-label="Channel number" data-i18n-attr="aria-label:ph.channelNumber" required />
            <datalist id="snap-channel-options"></datalist>
            <button type="submit" data-i18n="action.openLive">開啟即時畫面</button>
            <button type="button" id="snap-stop" class="btn-quiet" data-i18n="action.stopLive">停止</button>
            <button type="button" id="snap-capture" data-i18n="action.capture">擷取畫面</button>
            <span id="snap-msg" class="muted" aria-live="polite"></span>
          </form>
          <video id="snap-video" class="player" autoplay muted playsinline></video>
          <div id="snap-meta" class="muted"></div>
        </div>

        <div id="subpanel-ptz" class="subpanel" data-subpanel="ptz" role="tabpanel" aria-labelledby="subtabbtn-ptz" hidden>
          <form id="ptz-form" class="row-form">
            <input id="ptz-channel" type="number" min="1" step="1" list="ptz-channel-options" aria-label="Channel number" data-i18n-attr="aria-label:ph.channelNumber" required />
            <datalist id="ptz-channel-options"></datalist>
            <button type="submit" data-i18n="action.ptzConnect">連線</button>
            <label><span data-i18n="ptz.profile">碼流</span>
              <select id="ptz-profile" aria-label="Profile" data-i18n-attr="aria-label:ptz.profile"></select>
            </label>
            <span id="ptz-msg" class="muted" aria-live="polite"></span>
          </form>
          <!--
            速度：參考機（QCV8001 web PTZ 面板）是 1–8 的滑桿＋慢／快兩顆按鈕，每一道命令都帶
            這個值；我們這台相機吃的是 ONVIF ContinuousMove 的速度向量（-1..1），所以換算關係是
            「級別 ÷ 8」——預設取最小檔 1（幅度最小，避免一按就轉過頭）；需要快速轉向時
            操作員再自己調快，調過的值會記住。
          -->
          <div class="row-form">
            <label><span data-i18n="ptz.speed">速度</span>
              <input id="ptz-speed" type="range" min="1" max="8" step="1" value="1"
                     aria-label="PTZ speed" data-i18n-attr="aria-label:ptz.speed" />
            </label>
            <button type="button" id="ptz-slower" class="btn-quiet" data-i18n="ptz.slower">慢</button>
            <button type="button" id="ptz-faster" class="btn-quiet" data-i18n="ptz.faster">快</button>
            <span id="ptz-speed-value" class="muted">1</span>
          </div>
          <div id="ptz-pad" class="ptz-pad">
            <button type="button" class="ptz-btn" data-move="-1,1,0" aria-label="Up-left" data-i18n-attr="aria-label:ptz.upLeft">↖</button>
            <button type="button" class="ptz-btn" data-move="0,1,0" aria-label="Up" data-i18n-attr="aria-label:ptz.up">↑</button>
            <button type="button" class="ptz-btn" data-move="1,1,0" aria-label="Up-right" data-i18n-attr="aria-label:ptz.upRight">↗</button>
            <button type="button" class="ptz-btn" data-move="-1,0,0" aria-label="Left" data-i18n-attr="aria-label:ptz.left">←</button>
            <button type="button" class="ptz-btn ptz-stop" id="ptz-stop" aria-label="Stop" data-i18n-attr="aria-label:ptz.stop">■</button>
            <button type="button" class="ptz-btn" data-move="1,0,0" aria-label="Right" data-i18n-attr="aria-label:ptz.right">→</button>
            <button type="button" class="ptz-btn" data-move="-1,-1,0" aria-label="Down-left" data-i18n-attr="aria-label:ptz.downLeft">↙</button>
            <button type="button" class="ptz-btn" data-move="0,-1,0" aria-label="Down" data-i18n-attr="aria-label:ptz.down">↓</button>
            <button type="button" class="ptz-btn" data-move="1,-1,0" aria-label="Down-right" data-i18n-attr="aria-label:ptz.downRight">↘</button>
          </div>
          <div class="row-form">
            <button type="button" data-move="0,0,1" aria-label="Zoom in" data-i18n-attr="aria-label:ptz.zoomIn">+</button>
            <button type="button" data-move="0,0,-1" aria-label="Zoom out" data-i18n-attr="aria-label:ptz.zoomOut">−</button>
            <button type="button" id="ptz-home" class="btn-quiet" data-i18n="ptz.home">回預設位</button>
          </div>
          <form id="ptz-preset-form" class="row-form">
            <select id="ptz-preset-list" aria-label="Preset" data-i18n-attr="aria-label:ptz.preset"></select>
            <input id="ptz-preset-name" placeholder="Preset name" data-i18n-attr="placeholder:ptz.presetName,aria-label:ptz.presetName" aria-label="Preset name" />
            <button type="button" id="ptz-preset-save" data-i18n="ptz.savePreset">儲存預設點</button>
            <button type="button" id="ptz-preset-update" class="btn-quiet" data-i18n="ptz.updatePreset">更新位置</button>
            <button type="button" id="ptz-preset-goto" class="btn-quiet" data-i18n="ptz.gotoPreset">前往預設點</button>
            <button type="button" id="ptz-preset-delete" class="btn-quiet" data-i18n="ptz.deletePreset">刪除預設點</button>
          </form>
        </div>
      </div>
    </section>

    <section class="panel wide" id="panel-playback" data-panel="playback" role="tabpanel" aria-labelledby="tabbtn-playback" hidden>
      <h2><span data-i18n="nav.remotePlayback">遠程回放</span> <span class="muted" data-i18n="play.hlsHint">HLS／已錄影</span></h2>

      <nav class="subtabs" role="tablist" data-subtab-group="playback" aria-label="Playback tools" data-i18n-attr="aria-label:a11y.playbackTools">
        <button type="button" id="subtabbtn-playback" class="subtab active" role="tab" data-subtab="player" aria-selected="true" aria-controls="subpanel-playback"><span data-i18n="sub.playback">回放</span></button>
        <button type="button" id="subtabbtn-export" class="subtab" role="tab" data-subtab="export" aria-selected="false" aria-controls="subpanel-export"><span data-i18n="nav.export">匯出</span></button>
      </nav>

      <div class="subpanels" data-subpanel-group="playback">
        <div id="subpanel-playback" class="subpanel" data-subpanel="player" role="tabpanel" aria-labelledby="subtabbtn-playback">
          <form id="play-form" class="row-form">
            <select id="play-node" aria-label="Source node" data-i18n-attr="aria-label:replay.node"></select>
            <input id="play-channel" type="number" min="1" step="1" list="play-channel-options" aria-label="Channel number" data-i18n-attr="aria-label:ph.channelNumber" required />
            <datalist id="play-channel-options"></datalist>
            <input id="play-from" type="datetime-local" aria-label="Start time" data-i18n-attr="aria-label:ph.startTime" required />
            <input id="play-to" type="datetime-local" aria-label="End time" data-i18n-attr="aria-label:ph.endTime" required />
            <button type="submit" data-i18n="action.load">載入回放</button>
            <span id="play-msg" class="muted" aria-live="polite"></span>
          </form>
          <video id="play-video" class="player" controls playsinline preload="metadata"></video>
          <div class="play-toolbar" role="toolbar" aria-label="Playback tools" data-i18n-attr="aria-label:a11y.playbackTools">
            <button type="button" id="play-prev-frame" data-i18n="play.prevFrame" data-i18n-attr="title:play.prevFrame">上一張</button>
            <button type="button" id="play-next-frame" data-i18n="play.nextFrame" data-i18n-attr="title:play.nextFrame">下一張</button>
            <button type="button" id="play-back30" data-i18n="play.back30" data-i18n-attr="title:play.back30">後退 30 秒</button>
            <button type="button" id="play-forward30" data-i18n="play.forward30" data-i18n-attr="title:play.forward30">前進 30 秒</button>
            <label class="play-toolbar-field" for="play-speed"><span data-i18n="play.speed">速度</span></label>
            <select id="play-speed" aria-label="Playback speed" data-i18n-attr="aria-label:play.speed">
              <option value="0.25">0.25×</option>
              <option value="0.5">0.5×</option>
              <option value="1" selected>1×</option>
              <option value="2">2×</option>
              <option value="4">4×</option>
            </select>
            <label class="play-toolbar-field play-loop-field"><input id="play-loop" type="checkbox" data-i18n-attr="aria-label:play.loop" /><span data-i18n="play.loop">循環播放</span></label>
            <button type="button" id="play-fullscreen" data-i18n="cell.fullscreen" data-i18n-attr="title:cell.fullscreen">全螢幕</button>
          </div>
          <div id="play-clock" class="play-clock"></div>
          <div id="play-meta" class="muted"></div>
        </div>

        <div id="subpanel-export" class="subpanel" data-subpanel="export" role="tabpanel" aria-labelledby="subtabbtn-export" hidden>
          <p class="muted" data-i18n="export.hint">選取時段建立匯出工作，完成後下載 MP4</p>
          <form id="export-form" class="row-form">
            <select id="export-channel" aria-label="Channel" data-i18n-attr="aria-label:col.channel"></select>
            <input id="export-from" type="datetime-local" aria-label="Start time" data-i18n-attr="aria-label:ph.startTime" required />
            <input id="export-to" type="datetime-local" aria-label="End time" data-i18n-attr="aria-label:ph.endTime" required />
            <button type="submit" data-i18n="export.create">建立匯出工作</button>
            <button type="button" id="export-refresh" class="btn-quiet" data-i18n="action.refresh">立即更新</button>
            <span id="export-msg" class="muted" aria-live="polite"></span>
          </form>
          <table id="export-jobs">
            <thead><tr><th scope="col">ID</th><th scope="col" data-i18n="col.channel">頻道</th><th scope="col" data-i18n="col.time">時間</th><th scope="col" data-i18n="col.status">狀態</th><th scope="col" data-i18n="export.size">大小</th><th scope="col" data-i18n="export.createdAt">建立時間</th><th scope="col" data-i18n="col.text">內容</th></tr></thead>
            <tbody></tbody>
          </table>
          <div id="export-meta" class="muted"></div>
        </div>
      </div>
    </section>

    <section class="panel wide" id="panel-events" data-panel="events" role="tabpanel" aria-labelledby="tabbtn-events" hidden>
      <h2 data-i18n="nav.events">事件搜尋</h2>
      <form id="search-form" class="row-form search-section">
        <label class="field"><span data-i18n="col.keyword">關鍵字</span>
          <input id="q" placeholder="Keyword" data-i18n-attr="placeholder:ph.keyword,aria-label:ph.searchKeyword" aria-label="Event search keyword" />
        </label>
        <label class="field"><span data-i18n="ph.startTime">起始時間</span>
          <input id="event-from" type="datetime-local" aria-label="Start time" data-i18n-attr="aria-label:ph.startTime" />
        </label>
        <label class="field"><span data-i18n="ph.endTime">結束時間</span>
          <input id="event-to" type="datetime-local" aria-label="End time" data-i18n-attr="aria-label:ph.endTime" />
        </label>
        <label class="field"><span data-i18n="col.type">類型</span>
          <select id="event-type" aria-label="Event type" data-i18n-attr="aria-label:col.type">
            <option value="all" data-i18n="common.all">全部</option>
            <option value="alarm" data-i18n="replay.sourceAlarm">警報</option>
            <option value="access" data-i18n="replay.source">門禁</option>
            <option value="edge" data-i18n="replay.sourceEdgeAi">邊緣AI</option>
            <option value="pos">POS</option>
          </select>
        </label>
        <button type="submit" data-i18n="action.search">搜尋</button>
        <span id="events-msg" class="muted" aria-live="polite"></span>
      </form>
      <table id="events">
        <thead><tr><th scope="col">ID</th><th scope="col" data-i18n="col.time">時間</th><th scope="col" data-i18n="col.source">來源</th><th scope="col" data-i18n="col.text">內容</th><th scope="col" data-i18n="col.status">狀態</th><th scope="col" data-i18n="col.action">動作</th></tr></thead>
        <tbody></tbody>
      </table>
      <h2><span data-i18n="panel.liveAlarms">即時警報流</span></h2>
      <ul id="live-log" class="log" role="log" aria-live="polite"></ul>
    </section>

    <section class="panel wide" id="panel-settings" data-panel="settings" role="tabpanel" aria-labelledby="tabbtn-settings" hidden>
      <h2 data-i18n="nav.settings">設定</h2>

      <nav class="subtabs" role="tablist" data-subtab-group="settings" aria-label="Settings sections" data-i18n-attr="aria-label:a11y.settingsSections">
        <button type="button" id="subtabbtn-general" class="subtab active" role="tab" data-subtab="general" aria-selected="true" aria-controls="subpanel-general"><span data-i18n="sub.general">一般</span></button>
        <button type="button" id="subtabbtn-info" class="subtab" role="tab" data-subtab="info" aria-selected="false" aria-controls="subpanel-info"><span data-i18n="nav.info">裝置資訊</span></button>
        <button type="button" id="subtabbtn-io" class="subtab" role="tab" data-subtab="io" aria-selected="false" aria-controls="subpanel-io"><span data-i18n="nav.io">IO 接點</span></button>
      </nav>

      <div class="subpanels" data-subpanel-group="settings">
        <div id="subpanel-general" class="subpanel" data-subpanel="general" role="tabpanel" aria-labelledby="subtabbtn-general">
          <form id="settings-form" class="row-form">
            <label><input id="set-auth-enabled" type="checkbox" /> <span data-i18n="setting.enableAuth">啟用帳號登入</span></label>
            <label><span data-i18n="setting.lockThreshold">鎖定次數</span> <input id="set-lock-threshold" type="number" min="1" max="99" step="1" aria-label="Lockout attempts" data-i18n-attr="aria-label:setting.lockThreshold" /></label>
            <label><span data-i18n="setting.lockMinutes">鎖定分鐘</span> <input id="set-lock-minutes" type="number" min="1" max="1440" step="1" aria-label="Lockout minutes" data-i18n-attr="aria-label:setting.lockMinutes" /></label>
            <label><span data-i18n="setting.retentionDays">保留天數</span> <input id="set-retention-days" type="number" min="1" max="3650" step="1" aria-label="Retention days" data-i18n-attr="aria-label:setting.retentionDays" /></label>
            <label><span data-i18n="setting.watermarkGb">浮水印GB</span> <input id="set-watermark-gb" type="number" min="0" max="99999" step="0.1" aria-label="Watermark GB" data-i18n-attr="aria-label:setting.watermarkGb" /></label>
            <label><span data-i18n="setting.alarmRetention">警報保留</span> <input id="set-alarm-retention" type="number" min="1" max="36500" step="1" aria-label="Alarm retention" data-i18n-attr="aria-label:setting.alarmRetention" /></label>
            <label><span data-i18n="setting.auditRetention">稽核保留</span> <input id="set-audit-retention" type="number" min="0" max="36500" step="1" aria-label="Audit retention" data-i18n-attr="aria-label:setting.auditRetention" /></label>
            <button type="submit" data-i18n="setting.save">儲存設定</button>
            <span id="settings-msg" class="muted" aria-live="polite"></span>
          </form>
          <div id="settings-usage" class="muted" role="status" aria-live="polite"></div>
        </div>

        <div id="subpanel-info" class="subpanel" data-subpanel="info" role="tabpanel" aria-labelledby="subtabbtn-info" hidden>
          <div class="info-grid">
            <section class="panel">
              <h3 data-i18n="info.system">系統</h3>
              <table id="info-system" class="kv"><tbody></tbody></table>
            </section>
            <section class="panel">
              <h3 data-i18n="info.storage">儲存與狀態</h3>
              <table id="info-storage" class="kv"><tbody></tbody></table>
            </section>
          </div>
          <div class="row-form">
            <button type="button" id="info-refresh" class="btn-quiet" data-i18n="action.refresh">立即更新</button>
            <span id="info-msg" class="muted" aria-live="polite"></span>
          </div>
          <table id="info-drives">
            <thead><tr><th scope="col" data-i18n="info.diskRoot">磁碟</th><th scope="col" data-i18n="info.diskModel">型號</th><th scope="col" data-i18n="info.diskLevel">健康</th><th scope="col" data-i18n="info.diskTemp">溫度</th><th scope="col" data-i18n="info.diskFree">可用空間</th><th scope="col" data-i18n="info.diskRemain">剩餘可錄</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>

        <div id="subpanel-io" class="subpanel" data-subpanel="io" role="tabpanel" aria-labelledby="subtabbtn-io" hidden>
          <p class="muted" data-i18n="io.hint">攝影機 DI/DO 乾接點</p>
          <form id="io-form" class="row-form">
            <input id="io-channel" type="number" min="1" step="1" list="io-channel-options" aria-label="Channel number" data-i18n-attr="aria-label:ph.channelNumber" required />
            <datalist id="io-channel-options"></datalist>
            <button type="submit" data-i18n="action.ioLoad">讀取</button>
            <span id="io-msg" class="muted" aria-live="polite"></span>
          </form>
          <h3 data-i18n="io.inputs">數位輸入 (DI)</h3>
          <table id="io-inputs">
            <thead><tr><th scope="col" data-i18n="col.token">權杖</th><th scope="col" data-i18n="col.name">名稱</th><th scope="col" data-i18n="col.label">標籤</th></tr></thead>
            <tbody></tbody>
          </table>
          <h3 data-i18n="io.outputs">繼電器輸出 (DO)</h3>
          <table id="io-outputs">
            <thead><tr><th scope="col" data-i18n="col.token">權杖</th><th scope="col" data-i18n="col.name">名稱</th><th scope="col" data-i18n="col.label">標籤</th><th scope="col" data-i18n="col.action">動作</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
